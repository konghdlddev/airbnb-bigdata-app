services:
  minio:
    image: minio/minio:latest
    container_name: airbnb-minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  spark:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    container_name: airbnb-spark
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/app
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    command: bash -lc "tail -f /dev/null"

  streamlit:
    build:
      context: .
      dockerfile: infra/streamlit/Dockerfile
    container_name: airbnb-streamlit
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/app
      # Fix Streamlit + PyTorch conflict (torch.classes) ที่ทำให้ Natural Language Search ล้มเหลว
      STREAMLIT_SERVER_ENABLE_FILE_WATCHER: "false"
    depends_on:
      - minio
      - spark
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    command: bash -lc "chmod +x scripts/bootstrap.sh && ./scripts/bootstrap.sh"
    ports:
      - "8501:8501"

volumes:
  minio_data:
